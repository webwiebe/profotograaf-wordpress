name: Update E2E snapshots

# Regenerates the darwin baselines of tests/e2e/embed-visual.spec.js on the same
# runner the E2E job uses. Run it from the Actions tab. The new images come back as the
# artifact "e2e-snapshots": download it, copy the files into
# tests/e2e/embed-visual.spec.js-snapshots/ and commit them.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    name: Regenerate the embed.js baselines (WordPress 7.1)
    runs-on: [self-hosted, build]
    env:
      WP_VERSION: '7.1'
      E2E_VISUAL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: tests/e2e/ci-env.sh
      - run: tests/e2e/up.sh
      - run: pnpm exec playwright test tests/e2e/embed-visual.spec.js --update-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-snapshots
          path: tests/e2e/embed-visual.spec.js-snapshots
          if-no-files-found: error
      - if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v
