name: Embed bump

# A release of @profotograaf/embed in the platform repository sends
# `repository_dispatch` (embed-release) here. This workflow downloads the
# packed tarball from the GitHub release, checks it against the checksum GitHub
# recorded for the release asset, and runs scripts/embed-bump.mjs, which
# replaces embed-package/*.tgz, the file: pin in package.json, the lockfile
# entries and the package fixtures. It opens a PR; the normal CI (the parity
# checks) decides the merge. There is no registry: the tarball stays committed
# (professionals#2530).
#
# Needs the secret EMBED_BUMP_TOKEN: a fine-grained token with Contents (read)
# on wiebe-xyz/professionals, to read its releases, and Contents plus Pull
# requests (read and write) on this repository. The default token cannot read
# the private platform repository, and a PR it opens does not start CI.
#
# By hand: run the workflow with a version. With dry_run on (the default) it
# downloads, verifies and pins in the runner's checkout, and prints the diff
# without pushing or opening a PR.

on:
  repository_dispatch:
    types: [embed-release]
  workflow_dispatch:
    inputs:
      version:
        description: Embed package version to bump to (for example 1.2.0)
        required: true
      dry_run:
        description: Show the diff, push nothing
        type: boolean
        default: true

concurrency:
  group: embed-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PLATFORM_REPO: wiebe-xyz/professionals
  VERSION: ${{ github.event.client_payload.version || inputs.version }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

jobs:
  bump:
    name: Open the bump PR
    runs-on: [self-hosted, build]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.EMBED_BUMP_TOKEN }}
    steps:
      - name: Check the version and the token
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "EMBED_BUMP_TOKEN is not set" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a version: $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.EMBED_BUMP_TOKEN }}

      - name: Download the release tarball and verify it
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/embed-release"
          mkdir -p "$dir"
          tag="embed-v$VERSION"
          name="profotograaf-embed-$VERSION.tgz"
          gh release download "$tag" --repo "$PLATFORM_REPO" --dir "$dir" --pattern "$name"
          gh api "repos/$PLATFORM_REPO/releases/tags/$tag" \
            --jq '.assets[] | select(.digest != null) | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            > "$dir/SHA256SUMS"
          # The file we use must have a recorded checksum and match it.
          grep -q "  $name\$" "$dir/SHA256SUMS" || { echo "no checksum recorded for $name" >&2; exit 1; }
          (cd "$dir" && grep -E "  $name\$" SHA256SUMS | shasum -a 256 -c -)

      - name: Pin the tarball and sync the fixtures
        run: node scripts/embed-bump.mjs "$RUNNER_TEMP/embed-release/profotograaf-embed-$VERSION.tgz"

      - name: Open or update the PR
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "The plugin already holds embed $VERSION."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            git status --short
            git diff --stat
            echo "Dry run: nothing pushed."
            exit 0
          fi
          branch="embed-bump/$VERSION"
          git config user.name "profotograaf-embed-bot"
          git config user.email "embed-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add embed-package package.json pnpm-lock.yaml tests/fixtures/embed
          git commit -m "Bump the embed package to $VERSION"
          git push --force origin "$branch"
          url="https://github.com/$PLATFORM_REPO/releases/tag/embed-v$VERSION"
          body="Bumps @profotograaf/embed to $VERSION. Release: $url. The tarball was checked against the checksum GitHub recorded for the release asset. tests/e2e/fixtures/embed.js is not part of the package: refresh it with scripts/refresh-embed-fixture.sh when the capability test asks for it. Merge when CI is green."
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Bump the embed package to $VERSION" --body "$body"
          fi
