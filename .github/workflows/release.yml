name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Pull requests run no E2E and the full suite runs nightly, so a release runs
  # only the specs of the areas it changed since the previous tag. A release
  # that touches only docs, translations or workflows runs none.
  e2e-select:
    name: Pick the E2E specs for this release
    runs-on: [self-hosted, build]
    outputs:
      specs: ${{ steps.pick.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            # The first release has nothing to compare with: run the smoke set.
            specs="tests/e2e/gallery.spec.js tests/e2e/plugin-compat.spec.js tests/e2e/settings.spec.js"
          else
            specs=$(git diff --name-only "$previous" "${GITHUB_REF_NAME}" | node scripts/release-e2e-specs.mjs)
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  e2e:
    needs: e2e-select
    if: needs.e2e-select.outputs.specs != ''
    uses: ./.github/workflows/e2e.yml
    with:
      specs: ${{ needs.e2e-select.outputs.specs }}

  release:
    needs: [ci, e2e]
    # A skipped e2e job (nothing to run) does not block the release.
    if: ${{ !cancelled() && !failure() }}
    runs-on: [self-hosted, build]
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: bin/check-version.sh "${GITHUB_REF_NAME}"
      # The release draws markup on the server that the platform's script has
      # to adopt: stop here while the script it serves is older than the pin.
      - run: node scripts/check-live-embed.mjs
      - run: pnpm build
      - run: bin/build-release.sh --zip
      - run: bin/check-release-zip.sh
      # Two names for one file: profotograaf.zip serves
      # releases/latest/download/profotograaf.zip, profotograaf-<version>.zip
      # names its version.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/profotograaf.zip "dist/profotograaf-${GITHUB_REF_NAME#v}.zip" \
            --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Deploy to wordpress.org
        if: env.SVN_USERNAME != '' && env.SVN_PASSWORD != ''
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: profotograaf
          BUILD_DIR: dist/profotograaf
          ASSETS_DIR: assets/wporg
          VERSION: ${{ github.ref_name }}

  # The release marker (#251). It runs after the release and does nothing
  # without the BugBarn variable and secret.
  bugbarn-marker:
    needs: release
    runs-on: [self-hosted, build]
    steps:
      - uses: actions/checkout@v7
      - name: Post the release marker to BugBarn
        env:
          BUGBARN_ENDPOINT: ${{ vars.BUGBARN_ENDPOINT }}
          BUGBARN_API_KEY: ${{ secrets.BUGBARN_API_KEY }}
        run: bin/bugbarn-report.sh release "${GITHUB_REF_NAME}"
