name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs
      - run: bin/check-version.sh

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  blocks:
    name: Block build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint:js

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The release copy holds the built blocks, so Plugin Check reviews them too.
      - run: npm run build
      - run: tests/e2e/up.sh
      - run: tests/e2e/plugin-check.sh
      - if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v

  e2e:
    name: E2E (WordPress ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current release and the previous two majors.
        wp: ['7.1', '7.0', '6.9']
    env:
      WP_VERSION: ${{ matrix.wp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The E2E site runs the release copy, which holds the built blocks.
      - run: npm run build
      - run: tests/e2e/up.sh
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.wp }}
          path: |
            playwright-report
            test-results
      - if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v
