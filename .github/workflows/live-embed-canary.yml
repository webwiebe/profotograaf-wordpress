name: Live embed.js canary

# Runs the layout spec against the embed.js the platform serves today instead
# of the pinned copy in tests/e2e/fixtures. The API stays the mock platform. A
# failure opens one issue, or comments on the one that is already open. A pass
# closes it.

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

concurrency:
  group: live-embed-canary
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Layout spec with the live embed.js
    runs-on: [self-hosted, build]
    env:
      WP_VERSION: '7.1'
      EMBED_SCRIPT_URL: https://profotograaf.nl/share/embed/embed.js
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Live embed.js canary failed
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: tests/e2e/ci-env.sh
      - run: tests/e2e/up.sh
      # An old live script fails the layout spec in confusing ways (a Show more
      # that never adds tiles). Name that cause and skip the spec.
      - name: The live script is not older than the pinned one
        id: gate
        run: |
          # Exit 0 current, 1 older than the pin, 2 could not be read.
          code=0
          node scripts/check-live-embed.mjs || code=$?
          case "$code" in
            0) echo "older=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "older=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "older=unreadable" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Layout spec against the live script
        if: steps.gate.outputs.older == 'false'
        run: pnpm exec playwright test tests/e2e/embed-layout.spec.js
      - name: Fail while the live script is older than the pinned one
        if: steps.gate.outputs.older == 'true'
        run: exit 1
      - name: Fail when the live script could not be read
        if: steps.gate.outputs.older == 'unreadable'
        run: exit 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-embed-canary
          path: |
            playwright-report
            test-results
      - name: Open or update the issue
        if: failure()
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | first | .number // empty')"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${{ steps.gate.outputs.older }}" = "true" ]; then
            body="${EMBED_SCRIPT_URL} is older than the embed the plugin pins and lacks the adoption code for markup the plugin draws on the server. Deploy the embed package to the platform. Run: ${run}"
          elif [ "${{ steps.gate.outputs.older }}" = "unreadable" ]; then
            body="${EMBED_SCRIPT_URL} could not be read, so the version check did not run. A network or hosting problem stopped it. Run: ${run}"
          else
            body="The layout spec failed against ${EMBED_SCRIPT_URL}. Run: ${run}"
          fi
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
      - name: Close the issue after a pass
        if: success()
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | first | .number // empty')"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The layout spec passes against the live script again."
          fi
      - if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v
