name: CI

# Pull requests and pushes run the quality gates and the unit tests. The E2E
# suite is a browser run of about 75 runner minutes, so it lives in e2e.yml:
# nightly, on demand, and before a release for the areas the release touched.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js-quality:
    name: JS quality (gate tests, oxlint, tsc, knip, file length, workflows, vitest, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      # Every gate script has a test. It runs first: a gate that quietly stopped
      # failing looks exactly like a clean repo.
      - name: Gate script tests
        run: pnpm test:gates
      - name: oxlint ratchet
        run: node scripts/oxlint-ratchet.mjs
      - name: oxlint ratchet (type-aware)
        run: node scripts/oxlint-ratchet.mjs --type-aware
      - name: tsc
        run: pnpm typecheck
      - name: knip
        run: pnpm knip
      - name: File length
        run: pnpm check:file-length
      - name: Workflow rules and deploy graph
        run: node scripts/check-workflows.mjs
      - name: Dead PHP code
        run: node scripts/check-dead-php.mjs
      - name: Layer boundaries (report only)
        run: node scripts/check-boundaries.mjs --report
      - name: vitest
        run: pnpm test
      - name: pnpm audit (high and critical block)
        run: pnpm audit --audit-level high

  php-quality:
    name: PHP quality (PHPCS, PHPStan, composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs
      - name: PHP complexity (report only)
        run: node scripts/check-php-complexity.mjs --report
      - run: bin/check-version.sh
      - name: PHPStan config guard
        run: node --test scripts/phpstan-config.test.mjs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G
      - name: Composer audit gate tests
        run: node --test scripts/composer-audit-gate.test.mjs
      - name: Composer audit (high and critical block)
        run: composer audit --format=json --locked | node scripts/composer-audit-gate.mjs

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.9
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  coverage:
    name: Coverage (diff gate, cliff guard)
    needs: js-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.9
          coverage: pcov
      - uses: ./.github/actions/setup-node-pnpm
      - run: composer install --no-interaction --no-progress
      - name: vitest coverage
        run: pnpm test:coverage
      - name: PHPUnit coverage
        run: vendor/bin/phpunit --coverage-clover coverage/php/clover.xml
        env:
          XDEBUG_MODE: off
      - name: Diff coverage, TypeScript (blocking, 80% of changed lines)
        run: >
          node scripts/diff-coverage.mjs
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --format istanbul --coverage coverage/coverage-final.json
          --include '^blocks/.*\.tsx?$'
          --exclude '\.test\.|/test-support/|\.d\.ts$'
          --label TypeScript
      - name: Diff coverage, PHP (blocking, 80% of changed lines)
        run: >
          node scripts/diff-coverage.mjs
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --format clover --coverage coverage/php/clover.xml
          --include '^(includes/.*|profotograaf|uninstall)\.php$'
          --label PHP
      # Warns and exits 0 by design: a cliff guard, not a gate.
      - name: Total coverage cliff guard (non-blocking)
        run: node scripts/coverage-floor.mjs --ts coverage/coverage-summary.json --php coverage/php/clover.xml

  i18n:
    name: Translations (stale .pot, hardcoded strings, untranslated locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      # Builds the blocks, scans blocks/ and assets/ for text that skips __(),
      # fails when a languages/*.po has an untranslated or fuzzy string,
      # regenerates the .pot with WP-CLI in Docker and compares it with the
      # committed one. Translate new strings in every languages/*.po, then run
      # `make i18n` and commit languages/.
      - run: make i18n-check

  blocks:
    name: Block build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      # The release copy holds the built blocks, so Plugin Check reviews them too.
      - run: pnpm build
      - run: tests/e2e/up.sh
      - run: tests/e2e/plugin-check.sh
      - if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v

  zip-install:
    name: Release zip (structure, install on a clean WordPress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build
      - run: bin/build-release.sh --zip
      # One folder, the built blocks, no development files, under 5 MB.
      - run: bin/check-release-zip.sh
      # `wp plugin install` of the versioned zip and activation, as a site owner does it.
      - run: tests/e2e/zip-install.sh
